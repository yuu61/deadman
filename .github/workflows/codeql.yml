name: "CodeQL"

on:
  push:
    branches: ["master"]
    # 下記のパスのみが変更されたコミットではスキャンを起動しない。
    # （CodeQL の Go 解析対象でないファイル、およびテストコード）
    paths-ignore:
      - "**/*_test.go"
      - "**/*.md"
      - "img/**"
      - "plans/**"
      - "bin/**"
      - "deadman.conf"
      - "Makefile"
      - ".golangci.yml"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: ["master"]
    paths-ignore:
      - "**/*_test.go"
      - "**/*.md"
      - "img/**"
      - "plans/**"
      - "bin/**"
      - "deadman.conf"
      - "Makefile"
      - ".golangci.yml"
      - ".gitignore"
      - "LICENSE"
  schedule:
    # 毎週月曜 06:00 UTC に定期スキャン（paths-ignore の影響を受けずフル実行）
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # security-events への書き込みでスキャン結果をアップロードする
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
