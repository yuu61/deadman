# Run: ./deadman deadman.conf
# Syntax: name address [key=value ...]. Default probe: direct ICMP.
# Reference: README.md, docs/configuration.md, docs/platform.md

columns VIA=on MIN=off MAX=off

# Optional display settings.
#scale 1
#precision ms.1
#split 2
#glyph auto

--- ICMP / IPv4
googleDNS       dns.google    resolve_family=ipv4
mroot           202.12.27.33
--- ICMP / IPv6
googleDNS6      dns.google    resolve_family=ipv6
mroot6          2001:dc3::35

# QUIC handshake RTT (UDP 443); verify=on checks certificates.
--- QUIC / HTTP3
google-quic-v4  dns.google    probe=quic resolve_family=ipv4 verify=on
google-quic-v6  dns.google    probe=quic resolve_family=ipv6 verify=on

# TCP connect: no extra tools or privileges. Hostnames default to IPv4.
--- TCP / 53
google-tcp53    dns.google    probe=tcp port=53

# Optional examples: uncomment and replace environment-specific values.

# Hostname resolution: IPv4 or IPv6.
#web-v4         example.com resolve_family=ipv4
#web-v6         example.com resolve_family=ipv6

# Source interface, source IP, or IPv6 link-local target.
#googleDNS-eth0 8.8.8.8 source=eth0
#web-source-v4  example.com source=192.0.2.10
#link-local     fe80::1%eth0

# Forced gateway: Linux, root/CAP_NET_RAW; gateway must be on-link.
# Link-local gateways require source=IFNAME.
#googleDNS-gw   8.8.8.8 probe=nexthop nexthop=192.0.2.1 source=eth0
#googleDNS6-gw  2001:4860:4860::8888 probe=nexthop nexthop=fe80::1 source=eth0

# TCP port selection.
#web-tcp443     example.com probe=tcp port=443

# QUIC to an IP address: specify sni= for the server certificate.
#"Cloudflare QUIC" 1.1.1.1 probe=quic sni=cloudflare-dns.com verify=on

# SSH relay: requires key authentication and os=Linux|Darwin|FreeBSD.
#googleDNS-ssh  8.8.8.8 probe=ssh relay=192.0.2.1 os=Linux user=monitor key="/path/to/ssh key"
#web-ssh-v6     example.com probe=ssh relay=monitor@192.0.2.1 os=Linux resolve_family=ipv6

# Linux netns/VRF: requires root, ip and ping; relay= is the namespace/VRF.
#googleDNS-netns 8.8.8.8 probe=netns relay=netns1
#web-netns-v6   example.com probe=netns relay=netns1 resolve_family=ipv6
#googleDNS-vrf  8.8.8.8 probe=vrf relay=vrf1 source=eth0

# RouterOS REST API: requires relay=, username= and password=.
# Defaults: HTTPS, port 443, verify=on.
#googleDNS-routeros 8.8.8.8 probe=routeros relay=router.example.com username=monitor password="CHANGE ME"
#googleDNS-routeros6 8.8.8.8 probe=routeros relay=[2001:db8::1]:8443 scheme=https username=monitor password="CHANGE ME" verify=off

# SNMPv2c / DISMAN-PING-MIB (deprecated): requires relay= and community=.
#googleDNS-snmp 8.8.8.8 probe=snmp relay=192.0.2.1 community=public ;# UDP 161
