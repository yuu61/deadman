#
#	deadman config
#	See README.md for the full reference of options and platform requirements.
#

#	Column visibility (optional): list only the columns to change; the rest stay shown.
#	Columns: LOSS RTT AVG MIN MAX JIT SNT FAIL. 'm' toggles MIN/MAX at runtime, 'R' reloads.
columns VIA=off MIN=off MAX=off

#	Display (optional): "scale N" is the ms per RTT-bar step and the up/down step (default 10).
#	"precision ms|ms.1|ms.2|ms.3" sets the stat number format; 'p' cycles it.
#scale 10
#precision ms

#	Targets: "name address" per line. A dashes-only line draws a separator row.
googleDNS	8.8.8.8
quad9		9.9.9.9
mroot		202.12.27.33
kame		210.155.141.200
---
mroot6		2001:dc3::35
kame6		2001:2f0:0:8800::1:1

#	The modes below are commented-out examples. Each adds key=value attributes after the
#	address; uncomment and adapt one as needed.

#	resolve_family=ipv4|ipv6 -- pin a hostname's resolve family (direct ICMP only) to watch
#	a dual-stack name over v4 and v6 separately. Only ipv4 (A) / ipv6 (AAAA) are recognized,
#	and it is ignored with relay/via/tcp/nexthop. No record in that family, or the
#	other-family IP literal, shows as X.
#web-v4	example.com resolve_family=ipv4
#web-v6	example.com resolve_family=ipv6

#	ssh relay -- ping from a remote host over ssh. "relay" is required; "os" defaults to the
#	deadman host's OS; "user" and "key" set the ssh login.
#google-via-ssh	173.194.117.176 relay=X.X.X.X os=Linux user=USER key=RSAKEYPATH

#	snmp (SNMPv2, RFC 4560) -- ping from an SNMP agent. Needs "relay" and "community".
#googleDNS-via-snmp	8.8.8.8 relay=X.X.X.X via=snmp community=public

#	network namespace (Linux, root) -- ping from inside a netns named by "relay".
#googleDNS-via-netns	8.8.8.8 relay=netns1 via=netns

#	vrf (Linux, root) -- ping from inside a VRF named by "relay".
#googleDNS-via-vrf	8.8.8.8 relay=vrf1 via=vrf

#	tcp/hping3 (Linux, root; may also work on macOS) -- TCP probe to a port.
#wide-tcp80	203.178.136.59 tcp=dstport:80

#	nexthop=GWIP -- force a direct ICMP probe out a next-hop gateway (Linux, root/CAP_NET_RAW).
#	IPv4 (ARP) and IPv6 (NDP) both work; gateway and target must share the address family.
#	The gateway must be on-link; name the egress with source=IFNAME or source=SRCIP (IFNAME is
#	required for an fe80:: link-local gateway). If IPv4 rp_filter is strict, set
#	net.ipv4.conf.*.rp_filter to 2 or 0, or cross-interface replies may be dropped.
#googleDNS-via-gw	8.8.8.8 nexthop=192.0.2.1 source=eth0
#googleDNS6-via-gw	2001:4860:4860::8888 nexthop=fe80::1 source=eth0
