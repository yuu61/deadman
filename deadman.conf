#
#	deadman config
#
#	Column visibility (optional). List only the columns you want to change;
#	the rest stay shown. Columns: LOSS RTT AVG MIN MAX JIT SNT FAIL.
#	Press 'm' at runtime to toggle MIN/MAX; 'R' reloads this file.
#
columns VIA=off MIN=off MAX=off

#
#	Display precision (optional).
#	  scale N       ms per RTT-bar step; also the up/down keys. Default 10.
#	  precision P   stat number format (always ms), one of: ms | ms.1 | ms.2 | ms.3.
#	                More decimals = sub-ms resolution. Press 'p' to cycle.
#
#scale 10
#precision ms

googleDNS	8.8.8.8
quad9		9.9.9.9
mroot		202.12.27.33
kame		210.155.141.200
---
mroot6		2001:dc3::35
kame6		2001:2f0:0:8800::1:1




#
#	pin the resolve family for a hostname (direct ICMP only).
#		Monitor a dual-stack name over IPv4 and IPv6 separately. Only
#		"ipv4" (A record) and "ipv6" (AAAA record) are recognized; any
#		other value is treated as auto. The attribute is ignored when
#		relay/via/tcp/nexthop is set (those resolve the family elsewhere).
#		A name with no record in the pinned family, or an IP literal of
#		the other family, shows as X (unreachable).
#
#	Syntax
#	Name	Address	resolve_family=ipv4|ipv6
#
#web-v4	example.com resolve_family=ipv4
#web-v6	example.com resolve_family=ipv6


#
#	ping via ssh relay host.
#
# 	Syntax
#	Name	Address	relay=SSHHOST os=Linux user=USER key=RSAKEYPATH
#
#	In order to use ssh-relay, "relay" attribute must be specified.
#	if "os" is not specified, same OS name running the daedman is used.

#google-via-ssh	173.194.117.176 relay=X.X.X.X os=Linux


#
#	ping via snmpping (SNMPv2).  See RFC4560.
#
#	Syntax
#	Name	Address	relay=SNMPHOST via=snmp community=COMMUNITY
#
#googleDNS-via-snmp	8.8.8.8 relay=X.X.X.X via=snmp community=public


#
#	ping via network namespace (Linux only).
#		Note: root privilege is required to exec anything on netns
#
#	Syntax
#	Name	Address	relay=NETNSNAME via=netns
#
#googleDNS-via-netns	8.8.8.8 relay=netns1 via=netns

#
#	ping via vrf (Linux only).
#		Note: root privilege is required to exec anything on vrf
#
#	Syntax
#	Name	Address	relay=VRFNAME via=vrf
#
#googleDNS-via-vrf	8.8.8.8 relay=vrf1 via=vrf

#
#	tcp based ping (Linux only).
#		Note: root privilege is required to manipulate raw-socket
#		Note: tested with only linux, but macOS can be work.
#
#	Syntax
#	Name	Address tcp=dstport:80
#
#wide-tcp80	203.178.136.59 tcp=dstport:80


#
#	force a direct ICMP probe out via a specific next-hop gateway (Linux only).
#		Note: root/CAP_NET_RAW privilege is required. IPv4 and IPv6 both work
#		(ARP resolves the gateway MAC for IPv4, NDP for IPv6); the gateway and
#		the target must be the same address family.
#		The gateway must be on-link (directly connected). Pick the
#		egress with source=IFNAME or source=SRCIP. An IPv6 link-local
#		gateway (fe80::...) is on-link everywhere, so source=IFNAME is
#		required to name the egress interface.
#		If reverse-path filtering is strict (IPv4 only), set
#		net.ipv4.conf.*.rp_filter to 2 (loose) or 0 (off), or replies
#		to cross-interface probes may be dropped.
#
#	Syntax
#	Name	Address	nexthop=GWIP [source=eth0]
#
#googleDNS-via-gw	8.8.8.8 nexthop=192.0.2.1 source=eth0
#googleDNS6-via-gw	2001:4860:4860::8888 nexthop=fe80::1 source=eth0
