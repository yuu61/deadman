#
#	deadman config
#	See README.md for the full reference of options and platform requirements.
#

#	Column visibility (optional): list only the columns to change; the rest stay shown.
#	Columns: LOSS RTT AVG MIN MAX JIT SNT FAIL. 'm' toggles MIN/MAX at runtime, 'R' reloads.
columns VIA=off MIN=off MAX=off

#	Display (optional): "scale N" is the ms per RTT-bar step and the up/down step (default 1).
#	"precision ms|ms.1|ms.2|ms.3" sets the stat number format; 'p' cycles it.
#	"split N" lays the list out in N side-by-side columns (default 1); '[' / ']' adjust it.
#	"glyph auto|block|ascii|digit" picks the RESULT-bar characters (default auto: ascii where
#	the console font or locale cannot show block elements); 'b' cycles it, -g overrides it.
#scale 1
#precision ms
#split 2
#glyph auto

#	Targets: "name address" per line. A dashes-only line draws a separator row.
--- Google
google-v4   google.com resolve_family=ipv4
google-v6   google.com resolve_family=ipv6
googleDNS   8.8.8.8
googleDNS   008.008.008.008
googleDNS   2001:4860:4860::8888
googleDNS   2001:4860:4860:0:0::8888
googleDNS   2001:4860:4860:0:0:0:0:8888
--- mroot
mroot		202.12.27.33
mroot6		2001:dc3::35
--- QUIC
"Cloudflare QUIC" 1.1.1.1      probe=quic verify=on
"Google QUIC"   google.com      probe=quic verify=on


#	The modes below are commented-out examples. Each adds key=value attributes after the
#	address; uncomment and adapt one as needed.

#	resolve_family=ipv4|ipv6 -- pin a hostname's resolve family to watch a dual-stack name
#	over v4 and v6 separately (direct and quic; ssh/netns/vrf need it for a hostname). Only
#	ipv4 (A) / ipv6 (AAAA) are recognized; a method that does not use it, or an IP literal
#	of the other family, is a build error. No record in that family shows as X.
#web-v4	example.com resolve_family=ipv4
#web-v6	example.com resolve_family=ipv6

#	ssh relay -- ping from a remote host over ssh. "relay" and "os" (Linux|Darwin|FreeBSD, the
#	relay's ping) are required; "user" and "key" set the ssh login.
#google-via-ssh	173.194.117.176 probe=ssh relay=X.X.X.X os=Linux user=USER key=RSAKEYPATH

#	network namespace (Linux, root) -- ping from inside a netns named by "relay".
#googleDNS-via-netns	8.8.8.8 relay=netns1 probe=netns

#	vrf (Linux, root) -- ping from inside a VRF named by "relay".
#googleDNS-via-vrf	8.8.8.8 relay=vrf1 probe=vrf

#	tcp/hping3 (Linux, root; may also work on macOS) -- TCP probe to a port. hping3 is
#	IPv4 only: an IPv6 target is a build error, and a name resolves to its IPv4 address.
#wide-tcp80	203.178.136.59 probe=tcp port=80

#	quic (OS-independent, no external command) -- QUIC (TLS1.3) handshake RTT to a QUIC/h3
#	endpoint. Cert verification defaults OFF; "port" defaults 443, "alpn" h3. "sni" sets the
#	TLS ServerName -- a bare IP target against a real h3 front-end usually needs it.
#cloudflare-quic	1.1.1.1 probe=quic sni=cloudflare-dns.com
#google-quic		dns.google probe=quic

#	nexthop=GWIP -- force a direct ICMP probe out a next-hop gateway (Linux, root/CAP_NET_RAW).
#	IPv4 (ARP) and IPv6 (NDP) both work; gateway and target must share the address family.
#	The gateway must be on-link; name the egress with source=IFNAME or source=SRCIP (IFNAME is
#	required for an fe80:: link-local gateway). If IPv4 rp_filter is strict, set
#	net.ipv4.conf.*.rp_filter to 2 or 0, or cross-interface replies may be dropped.
#googleDNS-via-gw	8.8.8.8 probe=nexthop nexthop=192.0.2.1 source=eth0
#googleDNS6-via-gw	2001:4860:4860::8888 probe=nexthop nexthop=fe80::1 source=eth0

#	snmp (SNMPv2c, RFC 4560; deprecated) -- ping from an SNMP agent that implements
#	DISMAN-PING-MIB, which few do. Needs "relay" and "community". A target name is
#	resolved here and only its address reaches the agent, so a zoned target
#	(fe80::1%eth0) is a build error.
#googleDNS-via-snmp	8.8.8.8 relay=X.X.X.X probe=snmp community=public
